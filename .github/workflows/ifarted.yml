name: iFarted CI

on:
  push:
    paths:
      - 'apps/server/**'
      - 'apps/mobile/**'
      - 'packages/**'
  pull_request:
    paths:
      - 'apps/server/**'
      - 'apps/mobile/**'
      - 'packages/**'

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install server deps
        working-directory: apps/server
        run: bun install
      - name: Migrate DB
        working-directory: apps/server
        run: bun src/db/migrate.ts
      - name: Run integration tests
        working-directory: apps/server
        run: |
          bun src/index.ts &
          sleep 3
          bun src/test.ts
          kill %1

  mobile-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install mobile deps
        working-directory: apps/mobile
        run: npm install --legacy-peer-deps || true
      - name: Typecheck
        working-directory: apps/mobile
        run: npx tsc --noEmit || true

  udl-website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install
      - name: Build UDL website
        run: npm run build
